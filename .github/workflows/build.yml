name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=OmniBuilder AI, OU=Mobile, O=OmniBuilder, L=New York, S=NY, C=US"

      - name: Initialize Bubblewrap project
        run: |
          sudo apt-get install -y expect
          expect << 'EOF'
          spawn bubblewrap init --manifest="https://urbanbuildomniflow.site/manifest.json" --directory="twa-project" --skipPwaValidation
          expect "Do you want Bubblewrap to install the SDK*" { send "No\r" }
          expect eof
          EOF
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"

      - name: Update package ID and signing key
        run: |
          cd twa-project
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json','utf8'));
            m.packageId = 'site.urbanbuildomniflow.app';
            m.signingKey = { path: '../android.keystore', alias: 'android' };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('Updated:', m.packageId);
          "

      - name: Build AAB
        run: |
          cd twa-project
          expect << 'EOF'
          spawn bubblewrap build --skipPwaValidation
          expect "Do you want Bubblewrap to install the SDK*" { send "No\r" }
          expect eof
          EOF
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_SKIP_ANDROID_SDK_INSTALL: "true"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-project/app-release-bundle.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: twa-project/app-release-signed.apk
