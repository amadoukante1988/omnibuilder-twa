name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate keystore
        working-directory: twa-app
        run: |
          keytool -genkey -v \
            -keystore app/omnibuilder.keystore \
            -alias omnibuilder \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass omnibuilder123 \
            -keypass omnibuilder123 \
            -dname "CN=OmniBuilder, OU=Mobile, O=OmniBuilderAI, L=NY, ST=NY, C=US"

      - name: Make gradlew executable
        working-directory: twa-app
        run: chmod +x gradlew

      - name: Build Release AAB
        working-directory: twa-app
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: omnibuilder-release
          path: twa-app/app/build/outputs/bundle/release/app-release.aab
