name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          bubblewrap init --manifest https://urbanbuildomniflow.site/manifest.json --directory twa-project
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Build AAB
        run: |
          cd twa-project
          bubblewrap build
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-project/app-release-bundle.aab
