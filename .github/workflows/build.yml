L'éditeur est ouvert ! Voici ce que vous devez faire :

**1. Dans le champ "Name your file..."** tapez exactement :
```
.github/workflows/build.yml
```

**2. Dans l'éditeur (zone blanche)**, copiez-collez ce contenu :

```yaml
name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          bubblewrap init --manifest=https://urbanbuildomniflow.site/manifest.json

      - name: Build AAB
        run: bubblewrap build --skipPwaValidation

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: omnibuilder-release
          path: |
            app-release-bundle.aab
            app-release.apk
```

Envoyez une photo quand vous avez tout collé !
