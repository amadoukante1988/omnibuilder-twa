name: Build TWA AAB
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate signing key
        run: |
          keytool -genkey -v -keystore omnibuilder.keystore \
            -alias omnibuilder -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OmniBuilder AI, OU=Dev, O=OmniBuilder, L=NY, S=NY, C=US" \
            -storepass omnibuilder123 -keypass omnibuilder123

      - name: Prepare TWA project
        run: |
          mkdir -p twa-project
          cp twa-manifest.json twa-project/twa-manifest.json
          cd twa-project
          bubblewrap init --manifest=twa-manifest.json --directory=. \
            --androidSdkPath=$ANDROID_SDK_ROOT

      - name: Build AAB
        working-directory: twa-project
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --androidSdkPath=$ANDROID_SDK_ROOT \
            --keyPath=../omnibuilder.keystore \
            --keyAlias=omnibuilder \
            --keystorePassword=omnibuilder123 \
            --keyPassword=omnibuilder123

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: omnibuilder-release
          path: twa-project/app-release-bundle.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omnibuilder-apk
          path: twa-project/app-release-signed.apk
