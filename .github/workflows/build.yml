name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          mkdir twa-build && cd twa-build
          bubblewrap init --manifest https://urbanbuildomniflow.site/manifest.json

      - name: Build AAB
        run: cd twa-build && bubblewrap build

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v3
        with:
          name: omnibuilder-release
          path: twa-build/app/build/outputs/bundle/release/*.aab
