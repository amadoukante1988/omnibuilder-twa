name: Build TWA AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Generate signing key
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=OmniBuilder AI, OU=Mobile, O=OmniBuilder, L=New York, S=NY, C=US"

      - name: Prepare TWA project
        run: |
          mkdir -p twa-project
          cp twa-manifest.json twa-project/twa-manifest.json

      - name: Build AAB
        run: |
          cd twa-project
          yes no | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: "true"
          BUBBLEWRAP_SKIP_ANDROID_SDK_INSTALL: "true"
          SIGNING_KEY_STORE_PASS: "android123"
          SIGNING_KEY_PASS: "android123"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: twa-project/app-release-bundle.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: twa-project/app-release-signed.apk
